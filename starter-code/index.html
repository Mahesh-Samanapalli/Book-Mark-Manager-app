<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Bookmark manager app</title>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="logo-section">
          <img src="./assets/images/logo-light-theme.svg" alt="bookmark logo" />
        </div>
        <div class="sidebar-nav">
          <div class="navitem home">
            <img src="./assets/images/icon-home.svg" alt="" />
            <span>Home</span>
          </div>
          <div class="navitem archive">
            <img src="./assets/images/icon-archive.svg" alt="" />
            <span>Archived</span>
          </div>
        </div>
        <div class="sidebar-tags">
          <label class="tags-label" for="">TAGS</label>
          <div class="sidebar-container" id="sidebarContainer">
          </div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="search-bar">
            <img src="./assets/images/icon-search.svg" alt="" />
            <input type="text" placeholder="Search by title..."  id="searchInput"/>
          </div>
          <div class="user-profile">
            <div class="add-bookmark">
              <button class="add-bookmark-btn" id="addBookmarkBtn">+ Add Bookmark</button>
            </div>
            <div class="profile-cnt">
              <img src="./assets/images/image-avatar.webp" alt="" />

            </div>
          </div>
        </header>
        <section class="bookmark-section">
          <div class="filter-section">
            <h3>All Bookmarks</h3>
            <div class="filter-btn">
              <button class="sortBy-btn" id="sortBy-btn">
                <img src="./assets/images/icon-sort.svg" alt="" />sort by
              </button>
              <div class="sortBy-options" id ="sortBy-options"> 
                <button class="filter-btns-btn" value="recently_added"><span>Recently Added</span> <span class="check-icon">✓</span></button>
                <button class="filter-btns-btn" value="recently_visited"><span>Recently Visited</span> <span class="check-icon">✓</span></button>
                <button class="filter-btns-btn" value="most_visited"><span>Most Visited</span> <span class="check-icon">✓</span></button>
              </div>
            </div>
          </div>
          <div class="bookmark-container" id="bookmarkContainer">
          </div>
        </section>
      </main>
    </div>
    <div class="addBookmarkModal" id="addBookmarkModal">
      <div class="modal-content">
        <div class="model-header">
           <h2>Add a Bookmark</h2>
           <p>Save a link with details to keep your collection organized. We exract the favicon automatically from the URL</p>
           <span class="close-btn" id="closeBtn">&times;</span>
        </div>
        <div class="modal-body">
          <form id="addBookmarkForm" novalidate>
            <div class="form-group">
              <label for="title">Title <span class="required">*</span></label>
              <input type="text" id="title" name="title" required />
              <span class="error-msg" id="titleError"></span>
            </div>
            <div class="form-group">
              <label for="description">Description <span class="required">*</span></label>
              <textarea class="description-textarea" id="description" name="description" maxlength="280" rows="4" required></textarea>
              <span class="char-count">0/280</span>
              <span class="error-msg" id="descriptionError"></span>
            </div>
            <div class="form-group">
              <label for="websiteUrl">Website URL <span class="required">*</span></label>
              <input type="url" id="websiteUrl" name="websiteUrl" required />
              <span class="error-msg" id="websiteUrlError"></span>
            </div>
            <div class="form-group">
              <label for="tags">Tags <span class="required">*</span></label>
              <input type="text" id="tags" name="tags" placeholder="e.g., work, personal" required /> 
              <span class="error-msg" id="tagsError"></span>
            </div>
            <div class="action-btns">
              <button type="button" id="cancelBtn">Cancel</button>
              <button class="submit-btn" type="submit">Add Bookmark</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
